name: Windows Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    permissions:
      # Only the release step needs this, and it only runs for tags.
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          tools: 'tools_mingw1310'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Self test
        # The binary is a GUI-subsystem executable, so PowerShell does not wait
        # for it and leaves $LASTEXITCODE untouched when invoked directly, which
        # made this step pass no matter what the test returned. Piping forces
        # PowerShell to wait, so the exit code is real.
        run: |
          .\build\QtMazeGenerator.exe --self-test | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $staging = "dist\QtMazeGenerator"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item build\QtMazeGenerator.exe, LICENSE, README.md $staging

          # --compiler-runtime brings the MinGW runtime DLLs along with the Qt
          # ones, which the executable needs just as much.
          $windeployqt = if ($env:QT_ROOT_DIR) { Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe" } else { "windeployqt" }
          & $windeployqt --release --no-translations --compiler-runtime "$staging\QtMazeGenerator.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the package is self-contained
        # With nothing from the build environment on PATH, a DLL that
        # windeployqt failed to copy fails here rather than on a user's machine.
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          .\dist\QtMazeGenerator\QtMazeGenerator.exe --self-test | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            "QtMazeGenerator-$env:GITHUB_REF_NAME-windows-x64"
          } else {
            "QtMazeGenerator-windows-x64"
          }
          Compress-Archive -Path "dist\QtMazeGenerator\*" -DestinationPath "$name.zip" -Force
          "ARCHIVE=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtMazeGenerator-windows-x64
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      # Publishes only when a v* tag is pushed; ordinary pushes stop at the
      # build artifact above.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:ARCHIVE" --generate-notes
