name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          tools: 'tools_mingw1310'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Self test
        # The binary is a GUI-subsystem executable, so PowerShell does not wait
        # for it and leaves $LASTEXITCODE untouched when invoked directly, which
        # made this step pass no matter what the test returned. Piping forces
        # PowerShell to wait, so the exit code is real.
        run: |
          .\build\QtMazeGenerator.exe --self-test | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
